name: Release

on:
    push:
        branches:
            - 'master'

    # Manual trigger
    workflow_dispatch:
permissions:
    contents: read

jobs:
    gate:
        runs-on: ubuntu-latest
        name: Check release trigger
        outputs:
            run: ${{ steps.gate.outputs.run }}
        steps:
            - name: Gate on release commit
              id: gate
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [[ "$EVENT_NAME" == workflow_dispatch ]] || [[ "$MSG" =~ ^release\(.*\): ]]; then
                      echo "run=true" >> $GITHUB_OUTPUT
                  else
                      echo "run=false" >> $GITHUB_OUTPUT
                  fi
    publish:
        runs-on: ubuntu-latest
        name: Publish to npm
        needs: gate
        permissions:
            contents: write
            id-token: write
        if: needs.gate.outputs.run == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Set up pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  run_install: true
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - name: Get release version
              id: get_release_version
              run: echo "version=$(jq -r .version ./package.json)" >> $GITHUB_OUTPUT
            - name: Check if version is already published
              id: check_published
              run: |
                  if npm view "pki-lite@${{ steps.get_release_version.outputs.version }}" version >/dev/null 2>&1; then
                      echo "published=true" >> $GITHUB_OUTPUT
                  else
                      echo "published=false" >> $GITHUB_OUTPUT
                  fi
            - name: Compile
              run: pnpm compile
            - name: Publish packages
              if: steps.check_published.outputs.published != 'true'
              run: pnpm -r publish --tag=latest --provenance
            - name: Tag version
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git tag v${{ steps.get_release_version.outputs.version }} --force
                  MAJOR_VERSION=$(echo ${{ steps.get_release_version.outputs.version }} | cut -d. -f1)
                  git tag v${MAJOR_VERSION} --force
                  git tag latest --force
                  git push origin v${{ steps.get_release_version.outputs.version }} --force
                  git push origin v${MAJOR_VERSION} --force
                  git push origin latest --force
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Pack
              run: pnpm -r pack
            - name: Push artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pki-lite-${{ steps.get_release_version.outputs.version }}
                  path: ./*.tgz
    github-release:
        runs-on: ubuntu-latest
        name: Create GitHub Release
        needs: publish
        permissions:
            contents: write
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            - name: Get release version
              id: get_release_version
              run: VERSION_FILE=$(ls *.tgz | head -n 1) && echo "version=$(echo $VERSION_FILE | sed -E 's/^pki-lite-(.*)\.tgz$/\1/')" >> $GITHUB_OUTPUT
            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
              with:
                  draft: false
                  prerelease: ${{ contains(steps.get_release_version.outputs.version, '-') }}
                  generate_release_notes: true
                  tag_name: v${{ steps.get_release_version.outputs.version }}
                  files: './*.tgz'
