name: Test
on:
    push:
        branches:
            - master
            - ci/test # For testing changes to this workflow
    pull_request:
        branches:
            - master
    merge_group:
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
    actions: read
    checks: write
jobs:
    Tests:
        runs-on: ubuntu-24.04
        name: Tests
        defaults:
            run:
                # Every step runs in the flake's dev shell: Node 24, the pinned pnpm, OpenSSL
                # and nixpkgs' Chromium for the browser tests (no Playwright download).
                shell: nix develop --command bash -euo pipefail {0}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
            # The dev shell's closure, cached in the GitHub Actions cache. It changes only
            # with the flake, so most runs restore it and download nothing from nixpkgs.
            - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/pnpm.json') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-
                  purge: true
                  purge-prefixes: nix-${{ runner.os }}-
                  purge-created: 0
                  purge-primary-key: never
            - name: Locate the pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-${{ runner.os }}-
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Compile
              run: pnpm compile
            - name: Run tests
              run: pnpm test
